<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크루 초대 — PACE</title>
<meta name="description" content="PACE 러닝 크루에 초대되었습니다.">
<link rel="stylesheet" href="style.css">
<style>
  .invite { max-width: 460px; margin: 0 auto; text-align: center; padding: 60px 20px 40px; }
  .crew { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin: 6px 0 4px; }
  .members { color: var(--t55); font-size: 15px; }
  .cta { display:block; margin: 26px 0 10px; padding: 16px 20px; border-radius: 14px;
         background: var(--accent); color: #000; font-weight: 700; font-size: 16px;
         text-decoration: none; }
  .hint { color: var(--t45); font-size: 13px; line-height: 1.7; margin-top: 18px; }
  .err  { color: var(--t55); font-size: 15px; margin-top: 10px; }
  .badge { display:inline-block; padding: 5px 12px; border-radius: 999px; font-size: 12px;
           border: 1px solid var(--border); color: var(--accent); }
</style>
</head>
<body>

<nav class="nav"><div class="wrap">
  <a class="brand" href="index.html"><svg viewBox="0 0 32 32"><path d="M7 26 L13 10 L19 19 L25 12" fill="none" stroke="#00ff87" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27" cy="11" r="2.6" fill="#00ff87"/></svg>PACE</a>
  <div class="nav-links">
    <a href="index.html">홈</a>
    <a href="support.html">지원</a>
    <a href="privacy.html">개인정보</a>
  </div>
</div></nav>

<main class="wrap">
  <div class="invite">
    <div class="badge">크루 초대</div>
    <div id="content">
      <div class="crew" id="crewName">불러오는 중…</div>
    </div>

    <a class="cta" id="openApp" href="#">PACE 앱에서 열기</a>
    <a class="cta" style="background:transparent;border:1px solid var(--border);color:var(--accent)"
       id="appStore" href="https://apps.apple.com/kr/app/id6794831435">App Store에서 받기</a>

    <p class="hint">
      앱이 설치되어 있으면 위 버튼으로 바로 참여할 수 있어요.<br>
      처음이라면 앱을 설치한 뒤 <strong>이 링크를 다시 한 번</strong> 눌러주세요.
    </p>
  </div>
</main>

<footer><div class="wrap">
  <div>
    <a class="brand" href="index.html"><svg viewBox="0 0 32 32"><path d="M7 26 L13 10 L19 19 L25 12" fill="none" stroke="#00ff87" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27" cy="11" r="2.6" fill="#00ff87"/></svg>PACE</a>
    <div class="copy">© 2026 PACE. All rights reserved.</div>
  </div>
  <div class="fcol">
    <h4>바로가기</h4>
    <a href="index.html">홈</a>
    <a href="support.html">지원 &amp; FAQ</a>
    <a href="privacy.html">개인정보 처리방침</a>
  </div>
</div></footer>

<script>
// ⚠️ Supabase 프로젝트 값으로 교체하세요 (anon 키는 공개용이라 노출되어도 안전).
const SUPABASE_URL = "https://akxvhjflqsralrntliwm.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFreHZoamZscXNyYWxybnRsaXdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NTQ5MDEsImV4cCI6MjEwMDUzMDkwMX0.74kjAae0lvzEjqu_3Btldi1mFUtNLZn9jNcRLnbzBcg";

const token = new URLSearchParams(location.search).get("t") || "";
document.getElementById("openApp").href = location.href;

// 유효하지 않은 토큰이면 크루 정보를 아예 내려주지 않는다(서버에서 차단).
fetch(`${SUPABASE_URL}/rest/v1/rpc/crew_invite_preview`, {
  method: "POST",
  headers: { "apikey": SUPABASE_ANON, "Authorization": `Bearer ${SUPABASE_ANON}`,
             "Content-Type": "application/json" },
  body: JSON.stringify({ p_token: token })
})
  .then(r => r.json())
  .then(rows => {
    const r = Array.isArray(rows) ? rows[0] : null;
    const el = document.getElementById("content");
    if (!r || !r.valid) {
      el.innerHTML = `<div class="crew">초대를 열 수 없어요</div>
                      <div class="err">${(r && r.reason) || "유효하지 않은 초대 링크예요."}</div>`;
      return;
    }
    el.innerHTML = `<div class="crew">${r.crew_name}</div>
                    <div class="members">${r.members} / ${r.max_members}명 · 함께 달릴 크루에 초대되었어요</div>`;
  })
  .catch(() => {
    document.getElementById("content").innerHTML =
      `<div class="crew">초대를 불러오지 못했어요</div>
       <div class="err">잠시 후 다시 시도해주세요.</div>`;
  });
</script>

</body>
</html>
